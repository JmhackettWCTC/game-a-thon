<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>game-a-thon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/vapor/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/dist/css/style.css">
    <link rel="stylesheet" href="/src/css/style.css">
</head>
<body>
<header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand" href="#">Game-a-thon</a>
            <div>
                <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#collapseExample" aria-expanded="false" aria-controls="collapseExample">
                    lvl 21
                </button>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <button type="button" class="btn" id="home">Home</button>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn" type="button" data-bs-toggle="modal" data-bs-target="#selectGameModal">
                            Add
                        </button>
                    </li>
                    <li class="nav-item">
                        <button type="button" class="btn" data-bs-toggle="button" id="editButton">Edit</button>
                    </li>
                    <li class="nav-item">
                        <button type="button" class="btn" id="spinButton">Spin</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="collapse container" id="collapseExample">
        <div class="card card-body">
            <p>30pts till lvl 22</p>
            <div class="progress" role="progressbar" aria-label="Example with label" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar" style="width: 25%">10 pts</div>
            </div>
        </div>
    </div>
</header>
<div class="content-wrapper d-flex flex-column min-vh-100">
    <main class="container flex-grow-1" id="app">
        <!-- Your content goes here -->
    </main>
    <footer class="text-center position-fixed bottom-0 start-0 end-0 bg-body-tertiary p-3">
        <p>Copyright © 2023 Game-a-thon</p>
    </footer>
</div>
<div class="modal fade" id="selectGameModal" tabindex="-1" aria-labelledby="selectGameModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="selectGameModalLabel">Add a Platform OR Game</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="addGameForm">
                    <div class="row">
                        <div class="col">
                            <div class="mb-3" id="platformForm" v-if="itemType === 'platform'">
                                <label for="platformName" class="form-label">Platform Name</label>
                                <input type="text" class="form-control" id="platformName" required>
                            </div>
                            <div class="mb-3" id="platformForm" v-if="itemType === 'platform'">
                                <label for="platformColor" class="form-label">Platform Color</label>
                                <input type="text" class="form-control" id="platformColor" required>
                            </div>
                        </div>
                        <div class="col">
                            <div class="mb-3" id="gameForm" v-if="itemType === 'game'">
                                <label for="gameName" class="form-label">Game Name</label>
                                <input type="text" class="form-control" id="gameName" required>
                            </div>
                            <div class="mb-3" id="gameForm" v-if="itemType === 'game'">
                                <label for="gamePlatform" class="form-label">Game Platform</label>
                                <input type="text" class="form-control" id="gamePlatform" required>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal" id="liveToastBtn">Add</button>
            </div>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto">Game-a-thon</strong>
            <small>now</small>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body">
            added to list
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="/src/js/WireFramePrototype.js"></script>
</body>
</html>
